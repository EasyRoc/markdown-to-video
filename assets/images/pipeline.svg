<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#357ABD"/>
    </linearGradient>
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4A90D9;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="600">Markdown → Video 管线</text>

  <!-- Box 1: Markdown -->
  <rect x="30" y="70" width="150" height="80" rx="8" fill="#1e1e2e" stroke="#4A90D9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="105" y="102" text-anchor="middle" fill="#4A90D9" font-size="20">📄</text>
  <text x="105" y="128" text-anchor="middle" fill="#e0e0e0" font-size="13" font-weight="600">Markdown</text>
  <text x="105" y="144" text-anchor="middle" fill="#888" font-size="10">输入文件</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="110" x2="235" y2="110" stroke="url(#arrow-grad)" stroke-width="2"/>
  <polygon points="232,105 242,110 232,115" fill="#4A90D9"/>

  <!-- Box 2: Parser -->
  <rect x="245" y="70" width="150" height="80" rx="8" fill="#1e1e2e" stroke="#4A90D9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="102" text-anchor="middle" fill="#F92672" font-size="20">🔍</text>
  <text x="320" y="128" text-anchor="middle" fill="#e0e0e0" font-size="13" font-weight="600">解析器</text>
  <text x="320" y="144" text-anchor="middle" fill="#888" font-size="10">分段 + 注解</text>

  <!-- Arrow 2 -->
  <line x1="395" y1="110" x2="450" y2="110" stroke="url(#arrow-grad)" stroke-width="2"/>
  <polygon points="447,105 457,110 447,115" fill="#4A90D9"/>

  <!-- Box 3: TTS -->
  <rect x="460" y="70" width="150" height="80" rx="8" fill="#1e1e2e" stroke="#4A90D9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="535" y="102" text-anchor="middle" fill="#A6E22E" font-size="20">🔊</text>
  <text x="535" y="128" text-anchor="middle" fill="#e0e0e0" font-size="13" font-weight="600">TTS 引擎</text>
  <text x="535" y="144" text-anchor="middle" fill="#888" font-size="10">edge-tts 配音</text>

  <!-- Arrow 3 (down to row 2) -->
  <line x1="535" y1="150" x2="535" y2="195" stroke="url(#arrow-grad)" stroke-width="2"/>
  <polygon points="530,192 535,202 540,192" fill="#4A90D9"/>

  <!-- Box 4: Renderer -->
  <rect x="460" y="205" width="150" height="80" rx="8" fill="#1e1e2e" stroke="#4A90D9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="535" y="237" text-anchor="middle" fill="#E6DB74" font-size="20">🎨</text>
  <text x="535" y="263" text-anchor="middle" fill="#e0e0e0" font-size="13" font-weight="600">画面渲染</text>
  <text x="535" y="279" text-anchor="middle" fill="#888" font-size="10">布局 + 语法高亮</text>

  <!-- Arrow 4 (back up to right side) -->
  <line x1="535" y1="245" x2="535" y2="170" stroke="url(#arrow-grad)" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- parallel label -->
  <text x="548" y="188" fill="#888" font-size="9">并行</text>

  <!-- Arrow 5 -->
  <line x1="610" y1="110" x2="665" y2="110" stroke="url(#arrow-grad)" stroke-width="2"/>
  <polygon points="662,105 672,110 662,115" fill="#4A90D9"/>

  <!-- Box 5: Composer -->
  <rect x="675" y="70" width="170" height="80" rx="8" fill="#1e1e2e" stroke="#4A90D9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="760" y="102" text-anchor="middle" fill="#AE81FF" font-size="20">🎬</text>
  <text x="760" y="128" text-anchor="middle" fill="#e0e0e0" font-size="13" font-weight="600">视频合成</text>
  <text x="760" y="144" text-anchor="middle" fill="#888" font-size="10">ffmpeg 拼接</text>

  <!-- Arrow 6 (output) -->
  <line x1="845" y1="110" x2="875" y2="110" stroke="#4A90D9" stroke-width="2"/>
  <polygon points="872,105 882,110 872,115" fill="#4A90D9"/>

  <!-- Output -->
  <text x="888" y="114" fill="#A6E22E" font-size="13" font-weight="600">.mp4</text>

  <!-- Bottom annotation -->
  <text x="450" y="305" text-anchor="middle" fill="#666" font-size="10">注解系统贯穿全管线：voice · layout · image · highlight · pause · transition · bgm</text>
</svg>
