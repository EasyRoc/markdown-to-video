tts:
  voice: "zh-CN-XiaoxiaoNeural"
  speed: "+0%"
  pitch: "+0Hz"
  retry: 1

render:
  width: 1920
  height: 1080
  font_family: "/System/Library/Fonts/STHeiti Medium.ttc"
  font_family_mono: "/System/Library/Fonts/SFNSMono.ttf"
  font_size_title: 72
  font_size_body: 40
  font_size_code: 34
  bg_color: "#f5f5f5"
  code_bg_color: "#1e1e1e"
  accent_color: "#4A90D9"
  text_color: "#333333"
  light_text_color: "#e0e0e0"
  max_chars_per_segment: 200

video:
  fps: 30
  codec: "libx264"
  audio_codec: "aac"
  audio_bitrate: "192k"
  output_dir: "./output"
